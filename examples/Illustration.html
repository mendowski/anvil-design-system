<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens/anvil-tokens.css">
<link rel="stylesheet" href="../dist/anvil.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../dist/anvil.js"></script>
<script>(function(){var m=/[?&]theme=([\w-]+)/.exec(location.search);document.documentElement.setAttribute("data-theme",m?m[1]:"core-light")})()</script>

<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: var(--background-surface, #fff); font-family: var(--font-sans, system-ui, sans-serif); color: var(--text-body-base); }
  .cap { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-body-subdued); margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
  .sw { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; line-height: 14px; color: var(--text-body-subdued); width: 84px; text-align: center; }
  .heroes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement;
  var I = Anvil.Illustration;
  var spots = I.backgrounds.spot, heroes = I.backgrounds.hero;
  var spotArt = ["celebration", "achievement", "doctor-1", "healthy-eating", "mental-health", "sleep", "goals", "medications", "heart-health", "nurse", "savings", "coaching"];
  var heroArt = ["anytime", "meditate", "progress", "visit"];
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", null,
    h("div", { className: "cap" }, "Spot, round (72px), every background"),
    h("div", { className: "row" }, spots.map(function (b, i) { return h("div", { key: b, className: "sw" }, h(I, { name: spotArt[i], background: b }), b); })),
    h("div", { className: "cap" }, "Spot, fill"),
    h("div", { className: "row" }, spots.slice(0, 4).map(function (b, i) { return h("div", { key: b, className: "sw" }, h(I, { name: spotArt[i], background: b, placement: "fill" }), b); })),
    h("div", { className: "cap" }, "Hero (2:1), fill and round"),
    h("div", { className: "heroes" }, heroes.slice(0, 4).map(function (b, i) {
      return h("div", { key: b }, h(I, { type: "hero", name: heroArt[i], background: b, placement: i % 2 ? "round" : "fill" }), h("div", { className: "sw", style: { width: "auto", marginTop: 6 } }, heroArt[i] + " on " + b + (i % 2 ? ", round" : ", fill")));
    }))
  ));
</script>
</body>
</html>
