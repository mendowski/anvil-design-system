<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens/anvil-tokens.css">
<link rel="stylesheet" href="../dist/anvil.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../dist/anvil.js"></script>
<script>(function(){var m=/[?&]theme=([\w-]+)/.exec(location.search);document.documentElement.setAttribute("data-theme",m?m[1]:"core-light")})()</script>

<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: var(--background-base); font-family: var(--font-sans, system-ui, sans-serif); color: var(--text-body-base); }
  .grid { display: grid; gap: 32px; align-items: start; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-body-subdued); margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)) !important; }
  .sets { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)) !important; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement, A = Anvil;
  function cell(caption, el, w) { return h("div", { style: { width: w || "auto" } }, h("div", { className: "cap" }, caption), el); }
  var days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  var four = [{ value: "NN", unit: "unit", label: "Label 1" }, { value: "NN", unit: "unit", label: "Label 2" }, { value: "NN", unit: "unit", label: "Label 3" }, { value: "NN", unit: "unit", label: "Label 4" }];
  var one = [{ value: "NN", unit: "unit" }], two = [{ value: "NN", unit: "unit" }, { value: "NN", unit: "unit" }];
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "grid" },
    cell("Overlay", h("div", { className: "row", style: { alignItems: "flex-end" } },
      h(A.ChartTooltip, { x: "x-value", values: one }),
      h(A.ChartTooltip, { x: "x-value", values: two, beakAlign: "leading" }),
      h(A.ChartTooltip, { x: "x-value", values: two, range: true, beakAlign: "trailing" }),
      h(A.ChartTooltip, { x: "x-value", values: four, beak: "left", beakAlign: "leading" }),
      h(A.ChartTooltip, { x: "x-value", values: one, beak: "top" }))),
    cell("Inline", h("div", { className: "row" },
      h(A.ChartTooltip, { variant: "inline", x: "x-value", values: one }),
      h(A.ChartTooltip, { variant: "inline", x: "x-value", values: two }),
      h(A.ChartTooltip, { variant: "inline", x: "x-value", values: two, range: true }),
      h(A.ChartTooltip, { variant: "inline", x: "x-value", values: four }))),
    cell("Summary", h("div", { className: "row", style: { gap: 64 } },
      h(A.ChartSummary, { value: "NN", unit: "unit", label: "label" }),
      h(A.ChartSummary, { value: "NN", unit: "unit", value2: "NN", unit2: "unit", label: "label" }),
      h(A.ChartSummary, { value: "NN", unit: "unit", value2: "NN", unit2: "unit", range: true, label: "label" })))
  ));
</script>
</body>
</html>
