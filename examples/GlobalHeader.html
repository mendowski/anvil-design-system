<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens/anvil-tokens.css">
<link rel="stylesheet" href="../dist/anvil.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../dist/anvil.js"></script>
<script>(function(){var m=/[?&]theme=([\w-]+)/.exec(location.search);document.documentElement.setAttribute("data-theme",m?m[1]:"core-light")})()</script>

<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: var(--background-surface, #fff); font-family: var(--font-sans, system-ui, sans-serif); color: var(--text-body-base); }
  .grid { display: grid; gap: 32px 24px; align-items: start; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-body-subdued); margin-bottom: 8px; }
  body { background: var(--background-neutral); } .grid { grid-template-columns: 1fr; gap: 20px; } .row { display: grid; grid-template-columns: repeat(3, 358px); gap: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement;
  var A = Anvil;
  function cell(caption, el) { return h("div", null, h("div", { className: "cap" }, caption), el); }
  var G = A.GlobalHeader;
  var noop = function () {};
  var nav = [{ label: "Visits", href: "#", current: true }, { label: "Health log", href: "#" }, { label: "Learning", href: "#" }];
  var utils = [{ label: "Profile", icon: "profile", href: "#" }, { label: "Messages", icon: "mail", badge: 2, href: "#" }];
  var steps = ["Your health", "Medications", "Insurance", "Review"];
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "grid" },
    cell("Default (desktop)", h(G, { layout: "desktop", nav: nav, utilities: utils, language: "English", cta: { label: "Get care" } })),
    cell("Focused task (desktop)", h(G, { layout: "desktop", type: "focused", onBack: noop, onClose: noop })),
    cell("Progress tracker (desktop)", h(G, { layout: "desktop", type: "progress", steps: steps, currentStep: 1, onBack: noop, onClose: noop })),
    h("div", { className: "row" },
      cell("Default (mobile)", h(G, { layout: "mobile", utilities: utils, language: "English", cta: { label: "Get care" } })),
      cell("Focused task (mobile)", h(G, { layout: "mobile", type: "focused", title: "Book a visit", onBack: noop, onClose: noop })),
      cell("Progress tracker (mobile)", h(G, { layout: "mobile", type: "progress", steps: steps, currentStep: 1, onBack: noop, onClose: noop })))
  ));
</script>
</body>
</html>
