<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens/anvil-tokens.css">
<link rel="stylesheet" href="../dist/anvil.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../dist/anvil.js"></script>
<script>(function(){var m=/[?&]theme=([\w-]+)/.exec(location.search);document.documentElement.setAttribute("data-theme",m?m[1]:"core-light")})()</script>

<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: var(--background-neutral); font-family: var(--font-sans, system-ui, sans-serif); color: var(--text-body-base); }
  h2 { font-size: 14px; line-height: 20px; font-weight: 600; margin: 0 0 12px; }
  .sec + .sec { margin-top: 32px; }
  .bars { display: grid; grid-template-columns: repeat(auto-fill, 358px); gap: 12px 24px; align-items: end; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-body-subdued); margin-bottom: 8px; }
  .states { display: grid; grid-template-columns: repeat(5, 96px); gap: 12px 16px; }
  .states .anvil-tab { width: 96px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement;
  var F = Anvil.GlobalFooter, T = Anvil.TabItem;
  var tabs = [
    { label: "Home", icon: "home", href: "#" },
    { label: "Programs", icon: "programs", href: "#" },
    { label: "Health info", icon: "health-info", href: "#" },
    { label: "Messages", icon: "chat", href: "#" },
    { label: "Account", icon: "profile", href: "#" }
  ];
  function bar(cap, n, extra) {
    var items = tabs.slice(0, n).map(function (t, i) { return Object.assign({}, t, { current: i === 0 }, extra && extra[i]); });
    return h("div", { key: cap }, h("div", { className: "cap" }, cap), h(F, { items: items }));
  }
  function state(cap, props) {
    return h("div", { key: cap }, h("div", { className: "cap" }, cap), h(T, Object.assign({ label: "Item", icon: "home", href: "#" }, props)));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", null,
    h("div", { className: "sec" }, h("h2", null, "Navigation · all platforms"),
      h("div", { className: "bars" },
        bar("3 tabs", 3),
        bar("4 tabs", 4),
        bar("5 tabs", 5),
        bar("Count badge", 5, { 3: { badge: 2 } }),
        bar("Dot badge", 5, { 3: { badge: true } }),
        bar("Current on another tab", 5, { 0: { current: false }, 2: { current: true } }))),
    h("div", { className: "sec" }, h("h2", null, "Tab item states"),
      h("div", { className: "states" },
        state("Current", { current: true }),
        state("Default", {}),
        state("Hover", { state: "hover" }),
        state("Focus", { state: "focus" }),
        state("Pressed", { state: "pressed" })))
  ));
</script>
</body>
</html>
