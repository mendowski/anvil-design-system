<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: var(--background-surface, #fff); font-family: var(--font-sans, system-ui, sans-serif); color: var(--text-body-base); }
  .grid { display: grid; gap: 32px 24px; align-items: start; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-body-subdued); margin-bottom: 8px; }
  .grid { grid-template-columns: 358px 1fr; } .col { display: grid; gap: 24px; }
</style>

<body>
<div id="root"></div>
<script>
  var h = React.createElement;
  var A = Anvil;
  function cell(caption, el) { return h("div", null, h("div", { className: "cap" }, caption), el); }
  var Card = A.Card, B = A.Button;
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "grid" },
    h("div", { className: "col" },
      cell("Mobile (358px): buttons fill the width", h(Card, { header: "Your next dose", children: h("p", null, "Wednesday, Oct 8. Log your weight before you inject."), footer: h(B, null, "Log weight") })),
      cell("Spot image", h(Card, { header: "You hit your goal", image: { type: "spot", src: Anvil.Illustration.url("spot", "celebration") }, children: [h("p", { key: 1 }, "You've logged 4 weeks in a row."), h("p", { key: 2 }, "Keep it up.")], footer: h(B, { variant: "secondary" }, "See progress") })),
      cell("Filled footer", h(Card, { eyebrow: "Visit summary", header: "Dr. Rivera, Sep 30", headerAction: h(A.IconButton, { icon: "ellipsis", label: "More options", className: "anvil-icon-btn--brand" }), children: h("p", null, "Dose increased to 0.5 mg."), footerStyle: "filled", footer: [h(B, { key: 1 }, "Message provider"), h(B, { key: 2, variant: "secondary" }, "Download summary")] }))),
    h("div", { className: "col" },
      cell("Desktop (440px+): buttons hug their label", h(Card, { style: { maxWidth: 520 }, header: "Header", image: { type: "hero", src: Anvil.Illustration.url("hero", "anytime") }, children: h("p", null, "Use the main content slot for text, media or custom content."), footer: [h(B, { key: 1 }, "Primary"), h(B, { key: 2, variant: "tertiary" }, "Tertiary")] })),
      cell("Avatar", h(Card, { style: { maxWidth: 520 }, header: "Dr. Ana Rivera", image: { type: "avatar", src: Anvil.Illustration.url("spot", "doctor-1"), alt: "" }, children: h("p", null, "Endocrinology. Next available: tomorrow, 10:30 am."), footer: h(B, null, "Book a visit") })))
  ));
</script>
