<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens/anvil-tokens.css?v=20261124a">
<link rel="stylesheet" href="../dist/anvil.css?v=20261124c">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../dist/anvil.js?v=20261124d"></script>
<script>(function(){var m=/[?&]theme=([\w-]+)/.exec(location.search);document.documentElement.setAttribute("data-theme",m?m[1]:"core-light")})()</script>

<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: var(--background-surface, #fff); font-family: var(--font-sans, system-ui, sans-serif); color: var(--text-body-base); }
  .grid { display: grid; gap: 32px 40px; align-items: start; grid-template-columns: repeat(2, 1fr); }
  .cap { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-body-subdued); margin-bottom: 8px; }
  pre { margin: 0; padding: 16px; border-radius: 12px; background: var(--background-subdued); font-size: 13px; line-height: 20px; white-space: pre-wrap; color: var(--text-body-base); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement;
  var M = Anvil.MarkdownText;
  var SRC = "# Your care plan\n\nYour provider made a plan to help you manage **type 2 diabetes**. You can change it at any time.\n\n## This week\n\n1. Check your blood sugar each morning\n2. Log your meals\n3. Take a 20-minute walk after dinner\n\n### Good to know\n\n- Readings are *most useful* before breakfast\n- Bring your meter to your next visit\n\n#### Need help?\n\nRead the [care plan guide](https://www.example.com) or message your care team.";
  function cell(caption, el) { return h("div", null, h("div", { className: "cap" }, caption), el); }
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "grid" },
    cell("Markdown", h("pre", null, SRC)),
    cell("Rendered", h(M, null, SRC))
  ));
</script>
</body>
</html>
