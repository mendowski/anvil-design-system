<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens/anvil-tokens.css">
<link rel="stylesheet" href="../dist/anvil.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../dist/anvil.js"></script>
<script>(function(){var m=/[?&]theme=([\w-]+)/.exec(location.search);document.documentElement.setAttribute("data-theme",m?m[1]:"core-light")})()</script>

<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: var(--background-surface, #fff); font-family: var(--font-sans, system-ui, sans-serif); color: var(--text-body-base); }
  .grid { display: grid; gap: 32px 24px; align-items: start; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-body-subdued); margin-bottom: 8px; }
  .grid { grid-template-columns: repeat(3, 1fr); gap: 48px 32px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement;
  var A = Anvil;
  function cell(caption, el) { return h("div", null, h("div", { className: "cap" }, caption), el); }
  var Sl = A.Slider;
  var lbs = function (v) { return v + " lbs"; };
  var hrs = function (v) { return v + " hrs"; };
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "grid" },
    h(Sl, { label: "Weekly weight goal", helper: "How much to lose each week", min: 0, max: 3, step: 0.5, defaultValue: 1.5, formatValue: lbs }),
    h(Sl, { label: "Hours of sleep", helper: "Last night", min: 0, max: 12, defaultValue: 7, formatValue: hrs, state: "focus" }),
    h(Sl, { label: "Target range", helper: "Blood sugar, mg/dL", range: true, min: 50, max: 250, defaultValue: [80, 180] }),
    h(Sl, { label: "Right to left", helper: "Fills from the max end", direction: "rtl", min: 0, max: 10, defaultValue: 4 }),
    h(Sl, { label: "Pressed", helper: "Handle grows to 32px while dragging", min: 0, max: 10, defaultValue: 6, state: "pressed" }),
    h(Sl, { label: "Disabled", helper: "Helper text", min: 0, max: 10, defaultValue: 5, disabled: true })
  ));
</script>
</body>
</html>
