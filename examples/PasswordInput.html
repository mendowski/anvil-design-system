<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="../tokens/anvil-tokens.css">
<link rel="stylesheet" href="../dist/anvil.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../dist/anvil.js"></script>
<script>(function(){var m=/[?&]theme=([\w-]+)/.exec(location.search);document.documentElement.setAttribute("data-theme",m?m[1]:"core-light")})()</script>

<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: var(--background-surface, #fff); font-family: var(--font-sans, system-ui, sans-serif); color: var(--text-body-base); }
  .grid { display: grid; gap: 32px 24px; align-items: start; }
  .cap { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-body-subdued); margin-bottom: 8px; }
  .grid { grid-template-columns: repeat(3, 1fr); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var h = React.createElement;
  var A = Anvil;
  function cell(caption, el) { return h("div", null, h("div", { className: "cap" }, caption), el); }
  var P = A.PasswordInput;
  ReactDOM.createRoot(document.getElementById("root")).render(h("div", { className: "grid" },
    h("div", { style: { display: "grid", gap: 32 } },
      cell("Sign in", h(P, { defaultValue: "D@llasth-" })),
      cell("Hover on Show", h(P, { defaultValue: "D@llasth-", state: "hover-button" })),
      cell("Focus on input", h(P, { defaultValue: "D@llasth-", state: "focus-input" })),
      cell("Error", h(P, { defaultValue: "D@llasth-", status: "error", message: "That password doesn't match our records" })),
      cell("Disabled", h(P, { defaultValue: "D@llasth-", disabled: true }))),
    cell("Create password: type to see the strength update", h(P, { mode: "create", label: "Create a password", defaultValue: "Dallas2024" })),
    cell("Create password: strong", h(P, { mode: "create", label: "Create a password", defaultValue: "D@llas-th-2024", defaultVisible: true }))
  ));
</script>
</body>
</html>
