<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anvil Colors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; sticky control bar; each token group is a collapsible panel with a swatch strip in its header. */
:root {
  --bg: #fdfcff;
  --surface: #ffffff;
  --sunk: #f7f6fe;
  --ink: #0f1213;
  --muted: #545766;
  --line: #e4e2f0;
  --accent: #6240e8;
  --accent-soft: #eaeaff;
  --heading: #351f65;
  --check: #e9e8f0;
  --sans: "Lexend Deca", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120d26; --surface: #1a1433; --sunk: #160f2e; --ink: #fdfdfd; --muted: #b7b3cc;
    --line: #2f2850; --accent: #a699ff; --accent-soft: #2a2152; --heading: #eaeaff; --check: #2a2540;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #120d26; --surface: #1a1433; --sunk: #160f2e; --ink: #fdfdfd; --muted: #b7b3cc;
  --line: #2f2850; --accent: #a699ff; --accent-soft: #2a2152; --heading: #eaeaff; --check: #2a2540;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; font-weight: 300; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 80px; }
header.top h1 { font-size: 34px; line-height: 1.15; font-weight: 500; color: var(--heading); margin: 0 0 8px; text-wrap: balance; letter-spacing: -0.01em; }
header.top p { margin: 0; max-width: 64ch; color: var(--muted); }
header.top .meta { margin-top: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px; margin-top: 24px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); gap: 2px; }
.seg button { font: inherit; font-size: 13px; font-weight: 400; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 500; }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.search { flex: 1 1 220px; min-width: 0; position: relative; }
.search input { width: 100%; font: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.tools { display: flex; gap: 6px; }
.tools button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
.tools button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.groups { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
details.group { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.group > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; }
details.group > summary::-webkit-details-marker { display: none; }
.chev { width: 10px; height: 10px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; margin-left: 2px; }
details[open] > summary .chev { transform: rotate(45deg); }
.gname { font-weight: 500; font-size: 16px; color: var(--heading); }
.gname small { font-weight: 300; font-size: 13px; color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
.strip { display: flex; height: 22px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); width: min(320px, 34vw); }
.strip span { flex: 1; }
details[open] > summary { border-bottom: 1px solid var(--line); }

.rows { padding: 4px 0; }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) minmax(0, 220px); gap: 14px; align-items: center; padding: 10px 16px; }
.row + .row { border-top: 1px solid var(--line); }
.row.compare { grid-template-columns: minmax(0, 1fr) repeat(4, 64px); }
.sw { position: relative; width: 48px; height: 48px; border-radius: 8px; overflow: hidden; background: repeating-conic-gradient(var(--check) 0 25%, transparent 0 50%) 0 0 / 10px 10px; }
.sw i { position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(127, 127, 140, .28); }
.compare .sw { width: 64px; height: 36px; }
.name { display: flex; flex-direction: column; min-width: 0; }
.name button { all: unset; cursor: pointer; font-family: var(--mono); font-size: 13.5px; font-weight: 500; color: var(--ink); overflow-wrap: anywhere; width: fit-content; border-radius: 4px; }
.name button:hover { color: var(--accent); }
.name button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.name .usage { font-size: 13px; color: var(--muted); margin-top: 2px; max-width: 70ch; }
.val { font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.val .hex { color: var(--ink); text-transform: uppercase; }
.val .alias { display: block; color: var(--muted); }
.thead { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 64px); gap: 14px; padding: 10px 16px 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; }
.thead span:first-child { text-align: left; }
.cmpcell { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 13px; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }

@media (max-width: 640px) {
  header.top h1 { font-size: 28px; }
  .strip { display: none; }
  .row { grid-template-columns: 40px minmax(0, 1fr); }
  .row .sw { width: 40px; height: 40px; }
  .row .val { grid-column: 2; text-align: left; }
  .row.compare { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .row.compare .name { grid-column: 1 / -1; }
  .row.compare .sw { width: 100%; }
  .thead { display: none; }
  .cmpcell::before { content: attr(data-t); font-family: var(--sans); text-transform: none; }
}
@media (prefers-reduced-motion: reduce) { .chev, .toast { transition: none; } }
</style>

</head>
<body>
<div class="wrap"><p style="margin:0 0 24px"><a href="index.html" style="color:var(--accent)">← Anvil</a></p>
  <header class="top">
    <h1>Anvil Colors</h1>
    <p>Every color token in the Anvil design system, grouped the way you design with them. Open a group to see its tokens, pick a theme to see its values, or compare all four side by side. Click a token name to copy it.</p>
    <div class="meta" id="meta"></div>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Theme" id="themes"></div>
    <div class="search"><input id="q" type="search" placeholder="Search tokens, hex or primitive" aria-label="Search tokens" autocomplete="off"></div>
    <div class="tools"><button id="openAll" type="button">Expand all</button><button id="closeAll" type="button">Collapse all</button></div>
  </div>

  <div class="groups" id="groups"></div>
  <div class="empty" id="empty" hidden>No tokens match that search.</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    const cells = THEMES.map(th => {
      const [a, h] = t.v[th.id];
      return `<div class="cmpcell" data-t="${esc(SHORT[th.id])}" title="${esc(SHORT[th.id])}: ${esc(h)}${a ? " ← " + esc(a) : ""}"><span class="sw"><i style="background:${h}"></i></span>${esc(h.replace("#", ""))}</div>`;
    }).join("");
    return `<div class="row compare">${name}${cells}</div>`;
  }
  const [a, h] = t.v[theme];
  return `<div class="row"><span class="sw"><i style="background:${h}"></i></span>${name}<div class="val"><span class="hex">${hl(h)}</span>${a ? `<span class="alias">← ${hl(a)}</span>` : ""}</div></div>`;
}

function render() {
  for (const b of seg.children) b.setAttribute("aria-pressed", String(b.dataset.id === theme));
  const host = document.getElementById("groups");
  const stripTheme = theme === "compare" ? THEMES[0].id : theme;
  let shown = 0;
  host.innerHTML = "";
  for (const [g, list] of byGroup) {
    const hits = list.filter(matches);
    if (!hits.length) continue;
    shown += hits.length;
    const d = document.createElement("details");
    d.className = "group"; d.dataset.g = g;
    d.open = query ? true : openSet.has(g);
    const stripCols = hits.slice(0, 24).map(t => `<span style="background:${t.v[stripTheme][1]}"></span>`).join("");
    const count = query ? `${hits.length} of ${list.length}` : `${list.length}`;
    d.innerHTML = `<summary><span class="chev" aria-hidden="true"></span><span class="gname">${esc(g)}<small>${count}</small></span><span class="strip" aria-hidden="true">${stripCols}</span></summary>`;
    const body = document.createElement("div");
    body.className = "rows";
    const fill = () => {
      if (body.dataset.done) return;
      body.innerHTML = (theme === "compare" ? `<div class="thead"><span>Token</span>${THEMES.map(th => `<span>${esc(SHORT[th.id])}</span>`).join("")}</div>` : "") + hits.map(rowHTML).join("");
      body.dataset.done = "1";
    };
    if (d.open) fill();
    d.appendChild(body);
    d.addEventListener("toggle", () => {
      if (d.open) fill();
      if (query) return;
      d.open ? openSet.add(g) : openSet.delete(g);
      store.set("open", [...openSet]);
    });
    host.appendChild(d);
  }
  document.getElementById("empty").hidden = shown > 0;
}

document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
document.getElementById("openAll").onclick = () => { for (const d of document.querySelectorAll("details.group")) d.open = true; };
document.getElementById("closeAll").onclick = () => { for (const d of document.querySelectorAll("details.group")) d.open = false; };

const toast = document.getElementById("toast");
let tt;
function say(msg) { toast.textContent = msg; toast.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("on"), 1400); }
document.getElementById("groups").addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const text = b.dataset.copy;
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(b);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    say("Selected " + text + ". Press Cmd+C to copy.");
  };
  try { navigator.clipboard.writeText(text).then(() => say("Copied " + text), fallback); } catch (err) { fallback(); }
});

render();
</script>

</body>
</html>
